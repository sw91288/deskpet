<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    width: 100%; height: 100%; overflow: hidden;
  }
  .pet { width: 100%; height: 100%; position: relative; }
  #whale {
    width: 100%; height: 100%;
    object-fit: contain;
    user-select: none; -webkit-user-drag: none;
    animation: floaty 3s ease-in-out infinite;
  }
  @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  #bubble {
    position: absolute; top: -4px; left: 60%;
    transform: translateX(-50%);
    background: #ffffff; color: #333;
    border-radius: 14px; padding: 6px 10px;
    font-size: 13px; font-family: sans-serif;
    max-width: 180px; display: none; box-shadow: 0 2px 8px rgba(0,0,0,.15);
    white-space: nowrap; z-index: 10;
  }
</style>
</head>
<body>
<div class="pet" id="pet">
  <div id="bubble"></div>
  <img id="whale" src="whale/cool.png" alt="">
</div>
<script>
  var bubble = document.getElementById('bubble');
  var whale = document.getElementById('whale');
  var BASE = 'whale/';
  var FACES = ['cool','normal','happy','smile','tail'];
  function setFace(name){ whale.src = BASE + name + '.png'; }
  window.petEngine = {
    onTap: function(){
      var f = FACES[Math.floor(Math.random()*FACES.length)];
      setFace(f);
      say('戳我干嘛呀');
    },
    onDoubleTap: function(){ setFace('happy'); say('别戳啦，痒'); },
    onLongPress: function(){ setFace('cool'); say('……'); },
    say: say,
    setState: setState
  };
  function say(txt){
    bubble.style.display='block';
    bubble.textContent=txt;
    setTimeout(function(){ bubble.style.display='none'; }, 2200);
  }
  function setState(s){
    if(!s) return;
    if(s.face){ setFace(s.face); }
    if(s.speech_bubble){ say(s.speech_bubble); }
  }
</script>
</body>
</html>
